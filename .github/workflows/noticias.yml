name: Notícias automáticas

on:
  schedule:
    # Três rodadas por dia (08h, 11h e 14h30 de Brasília). O script decide: nota ("Radar") todo dia, artigo completo quando o último
    # tem 2 dias ou mais. As rodadas 2 e 3 só fazem algo se a anterior não publicou o artigo; só a 3ª pode deixar o run vermelho.
    - cron: "0 11 * * *"
    - cron: "0 14 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar = vai ao ar na main · amostra = gera 3 artigos + 1 nota SEM publicar (arquivos em amostras/ na branch escolhida) · diagnostico = testa modelos do Gemini e a coleta de notícias · resumo_teste = manda por e-mail o resumo semanal de teste (com as amostras)"
        type: choice
        default: publicar
        options: [publicar, amostra, diagnostico, resumo_teste]
      rodada:
        description: "Rodada do dia (execução manual vale como rodada final: se falhar, o run fica vermelho)"
        type: choice
        default: final
        options: [final, "1", "2"]
      forcar_artigo:
        description: "Gerar artigo hoje mesmo que não seja o dia (continua valendo 1 por dia)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Diagnóstico do Gemini (só modo diagnostico)
        if: inputs.modo == 'diagnostico'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/noticias/diagnostico.js

      - name: Resumo semanal de teste (só modo resumo_teste)
        if: inputs.modo == 'resumo_teste'
        env:
          TESTE: "1"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTA_EMAIL_PARA: ${{ secrets.ALERTA_EMAIL_PARA }}
          ALERTA_EMAIL_DE: ${{ secrets.ALERTA_EMAIL_DE }}
        run: node scripts/noticias/resumo-semanal.js

      - name: Gerar, verificar e revisar
        id: gerar
        if: inputs.modo != 'diagnostico' && inputs.modo != 'resumo_teste'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MODO: ${{ inputs.modo || 'publicar' }}
          RODADA: ${{ inputs.rodada || (github.event.schedule == '0 11 * * *' && '1' || github.event.schedule == '0 14 * * *' && '2' || 'final') }}
          FORCAR_ARTIGO: ${{ inputs.forcar_artigo && '1' || '0' }}
        run: |
          npm i --no-save sharp
          node scripts/noticias/run.js

      - name: Gravar na branch (sem Pull Request)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/noticias/gravar.sh "Notícias automáticas (${{ inputs.modo || 'publicar' }}) $(date -u +%F)"

      - name: Falhar se houve erro
        if: steps.gerar.outcome == 'failure'
        run: exit 1

      - name: Avisar por e-mail (problema que exige uma pessoa, ou 3 dias seguidos com falha)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTA_EMAIL_PARA: ${{ secrets.ALERTA_EMAIL_PARA }}
          ALERTA_EMAIL_DE: ${{ secrets.ALERTA_EMAIL_DE }}
          CAUSA_HUMANA: ${{ steps.gerar.outputs.humano == '1' && steps.gerar.outputs.causa || '' }}
        run: node scripts/noticias/alerta.js
