name: Notícias automáticas

on:
  schedule:
    # Todo dia às 08h de Brasília. O script decide: nota ("Radar") todo dia, artigo completo a cada 2 dias.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar = vai ao ar na main · amostra = gera 3 artigos + 1 nota SEM publicar (arquivos em amostras/ na branch escolhida) · diagnostico = testa modelos do Gemini e a coleta de notícias · resumo_teste = manda por e-mail o resumo semanal de teste (com as amostras)"
        type: choice
        default: publicar
        options: [publicar, amostra, diagnostico, resumo_teste]
      forcar_artigo:
        description: "Gerar artigo hoje mesmo que não seja o dia (continua valendo 1 por dia)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Diagnóstico do Gemini (só modo diagnostico)
        if: inputs.modo == 'diagnostico'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/noticias/diagnostico.js

      - name: Resumo semanal de teste (só modo resumo_teste)
        if: inputs.modo == 'resumo_teste'
        env:
          TESTE: "1"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTA_EMAIL_PARA: ${{ secrets.ALERTA_EMAIL_PARA }}
          ALERTA_EMAIL_DE: ${{ secrets.ALERTA_EMAIL_DE }}
        run: node scripts/noticias/resumo-semanal.js

      - name: Gerar, verificar e revisar
        id: gerar
        if: inputs.modo != 'diagnostico' && inputs.modo != 'resumo_teste'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MODO: ${{ inputs.modo || 'publicar' }}
          FORCAR_ARTIGO: ${{ inputs.forcar_artigo && '1' || '0' }}
        run: |
          npm i --no-save sharp
          node scripts/noticias/run.js

      - name: Gravar na branch (sem Pull Request)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nada novo para gravar."; exit 0; fi
          git commit -m "Notícias automáticas (${{ inputs.modo || 'publicar' }}) $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done

      - name: Falhar se houve erro
        if: steps.gerar.outcome == 'failure'
        run: exit 1

      - name: Avisar por e-mail (3 falhas seguidas)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTA_EMAIL_PARA: ${{ secrets.ALERTA_EMAIL_PARA }}
          ALERTA_EMAIL_DE: ${{ secrets.ALERTA_EMAIL_DE }}
        run: node scripts/noticias/alerta.js
