name: Despublicar texto

# Tira um artigo ou nota do ar (site, home, Radar e sitemap) e impede o robô de republicar o mesmo assunto.
on:
  workflow_dispatch:
    inputs:
      endereco:
        description: "Endereço do artigo (ex.: https://revisional.eraseconsulta.com.br/noticias/nome-do-artigo) ou da nota (…/radar#id)"
        required: true
        type: string
      motivo:
        description: "Motivo (opcional, fica registrado)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: despublicar   # grupo próprio: não é cancelado/enfileirado atrás das rodadas de notícias e fotos
  cancel-in-progress: false

jobs:
  despublicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Tirar do ar
        env:
          ENDERECO: ${{ inputs.endereco }}
          MOTIVO: ${{ inputs.motivo }}
        run: node scripts/noticias/despublicar.js
      - name: Gravar na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Despublica texto (manual)"
          enviado=0
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then enviado=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ "$enviado" != 1 ]; then
            echo "::error::A despublicação NÃO foi enviada para ${GITHUB_REF_NAME} (conflito ou falha no push). O texto continua no ar: rode de novo."
            exit 1
          fi
