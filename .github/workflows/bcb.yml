name: Atualizar série do Banco Central

on:
  schedule:
    # Todo dia, do 5 ao 25 de cada mês: o BC publica a média do mês com defasagem. Se não há mês novo,
    # nada muda e nada é gravado; quando sai dado novo, a série é gravada direto na main (sem Pull Request).
    - cron: "0 12 5-25 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bcb
  cancel-in-progress: false

jobs:
  bcb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Baixar série do Banco Central (com travas contra dado parcial)
        run: node scripts/update-bcb.js
      - name: Reconstruir o site
        run: node scripts/build.js
      - name: Gravar se houve mês novo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sem mês novo do Banco Central."; exit 0; fi
          git commit -m "Atualiza série histórica do Banco Central"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
