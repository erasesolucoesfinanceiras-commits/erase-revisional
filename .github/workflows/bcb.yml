name: Atualizar série do Banco Central (mensal)

on:
  schedule:
    - cron: "0 12 6 * *" # dia 6 de cada mês (o BC publica com defasagem)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bcb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Baixar série do Banco Central
        run: node scripts/update-bcb.js
      - name: Reconstruir o site
        run: node scripts/build.js
      - name: Abrir Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bcb/atualizacao-${{ github.run_id }}
          commit-message: "Atualiza série histórica do Banco Central"
          title: "Atualiza série histórica do Banco Central"
          body: "Série mensal de juros (aquisição de veículos) atualizada automaticamente pelo SGS/Banco Central. Confira o último mês antes do merge."
