name: Verificar artigo recente

# Rede de segurança do sistema de artigos (todo dia às 16h30 de Brasília, depois das 3 rodadas de geração):
# dispara a geração se o agendamento falhou, confere a capa do site no ar (e pede novo deploy ao Cloudflare Pages se faltar),
# falha se o último artigo tem mais de 3 dias e registra atividade diária para o GitHub não desativar os workflows agendados.
on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: verificar-artigo
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verificar (gerar se faltou, conferir o site, registrar atividade)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CF_DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/noticias/verificar-dia.js
      - name: Avisar por e-mail (só se a verificação falhou de verdade)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTA_EMAIL_PARA: ${{ secrets.ALERTA_EMAIL_PARA }}
          ALERTA_EMAIL_DE: ${{ secrets.ALERTA_EMAIL_DE }}
          ALERTA_WORKFLOW: verificar-artigo.yml
        run: |
          CAUSA=$(tail -n 1 data/noticias-log.jsonl 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).causa||'')}catch(e){}})")
          export CAUSA_HUMANA="${CAUSA:-A verificação diária falhou: o site pode estar desatualizado ou sem artigo novo há mais de 3 dias.}"
          node scripts/noticias/alerta.js
