name: Buscar fotos dos artigos (Pixabay)

# Roda sozinho ao enviar mudanças em branches "claude/**" e manualmente (aba Actions).
# Preenche a foto dos artigos que ainda não têm e salva no mesmo branch (a prévia da hospedagem atualiza).
on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/photos.js", "data/articles.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm i --no-save sharp
      - name: Buscar fotos
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # filtro visual da foto (sem imagem sexual/violenta/perturbadora, ligada ao assunto)
        run: node scripts/photos.js
      - name: Salvar no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Fotos dos artigos (Pixabay)" && git push; }
