name: Buscar fotos dos artigos (Pixabay)

# SÓ MANUAL e SÓ na branch "main" (aba Actions > Run workflow, branch "main"): antes rodava em todo push em "claude/**" com os segredos e
# gastava ~1 h de Actions por push. REFAZ a foto de um artigo (por slug) ou de todos os marcados
# com "foto_refazer": true em data/articles.json, substituindo a atual. Mantém o filtro visual do Gemini, o crédito do autor
# e, como último recurso, a imagem padrão do site. A foto escolhida e o motivo ficam em data/noticias-log.jsonl (evento "foto_escolhida").
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "marcadas = refaz as fotos dos artigos marcados com foto_refazer · slug = refaz só o artigo do campo abaixo · faltantes = só quem não tem foto"
        type: choice
        default: marcadas
        options: [marcadas, slug, faltantes]
      slug:
        description: "Slug do artigo (só no modo slug), ex.: pf-apura-fraude-em-financiamentos-veiculares-com-uso-de-biometria-em-mg"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  fotos:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Buscar fotos
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # filtro visual da foto (sem imagem sexual/violenta/perturbadora, sem pessoa em destaque, ligada ao assunto)
          FOTO_MODO: ${{ inputs.modo || 'faltantes' }}
          FOTO_SLUG: ${{ inputs.slug }}
        run: node scripts/photos.js
      - name: Salvar no branch (refaz com rebase se a branch andou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/noticias/gravar.sh "Fotos dos artigos (Pixabay)"
